# Who we are. Tripwire's daily refresh uses this to find competitors with the same ICP.
name: Teamily AI
url: https://teamily.ai
one_liner: >
  AI-native messenger where people and always-on AI agents work together in shared group chats,
  with connected context and memory; turns conversations into finished work (apps, slides,
  research, docs).
icp:
  - Small teams, startups and prosumers who coordinate work in chat and want AI agents inside it
  - Groups (work, family, communities) that want agents as members of the group chat
  - People choosing between ChatGPT/Claude team plans, Slack/Teams with AI, and agent-team apps
platforms: [web, macOS, Windows, iOS, Android]
# What counts as a competitor, per group in watch/targets.yml:
groups:
  direct: human + AI group chat, multi-agent teams in a messenger, "AI coworkers" in chat
  platform: big AI assistants adding shared workspaces, projects, group chats or agents
  indirect: team chat and collaboration tools adding AI agents
# Social and news sources the daily refresh searches for each competitor.
signals: [launches, product updates, funding, pricing, X / Twitter, LinkedIn, Product Hunt, Hacker News, Reddit, YouTube, press]
