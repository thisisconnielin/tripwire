# Tripwire watch list. Add competitors with `tripwire.py add`, or edit this file.
#
#   competitors:
#     - name: Acme
#       group: direct             # optional label: direct / platform / indirect …
#       reason: why they're a competitor
#       fit: their own homepage words that show the overlap
#       pages:
#         - { label: home,      url: https://acme.example }
#         - { label: pricing,   url: https://acme.example/pricing }
#         - { label: changelog, url: https://acme.example/changelog }
#
# Optional, at any level (global / competitor / page):
#   ignore:    [regex, ...]   lines matching these are stripped before diffing
#   min_lines: 2              ignore changes smaller than this many lines
#   enabled:   false          stop watching a page or competitor

min_lines: 1
ignore: []

competitors: []
