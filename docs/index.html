<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stakeout</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
<style>
  :root {
    --bg:#f6f4ef; --fg:#17161a; --muted:#6c6a72; --card:#ffffff; --line:#e4e0d8;
    --accent:#3d5afe; --add:#0f8a4b; --add-bg:#e6f6ec; --rm:#c2341f; --rm-bg:#fcebe7;
    --pricing:#b45309; --hiring:#7c3aed; --product:#0369a1; --messaging:#4b5563; --baseline:#9ca3af;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#111114; --fg:#efeef2; --muted:#9a98a3; --card:#1a1a1f; --line:#2b2b33;
      --accent:#7b8cff; --add:#5fd393; --add-bg:#14261c; --rm:#ff8a75; --rm-bg:#2c1714;
      --pricing:#f5a524; --hiring:#b794f6; --product:#5ab4f0; --messaging:#a1a1aa; --baseline:#6b7280;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:880px; margin:0 auto; padding:32px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
  h1 { margin:0; font-size:34px; letter-spacing:-.03em; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); margin:2px 0 0; }
  .meta { color:var(--muted); font-size:13px; text-align:right; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
  @media (max-width:600px) { .stats { grid-template-columns:repeat(2,1fr); } }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .stat b { display:block; font-size:24px; letter-spacing:-.02em; }
  .stat small { color:var(--muted); }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  select, input { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:7px 10px; }
  input { flex:1; min-width:160px; }
  .feed { display:flex; flex-direction:column; gap:10px; }
  .day { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:14px 0 2px; }
  .ev { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .ev-top { display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; }
  .who { font-weight:650; }
  .who a { color:var(--muted); font-weight:400; text-decoration:none; font-size:13px; margin-left:6px; }
  .who a:hover { color:var(--accent); }
  .tags { display:flex; gap:6px; }
  .tag { font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; border:1px solid currentColor; text-transform:lowercase; }
  .summary { margin:6px 0 0; }
  details { margin-top:8px; }
  summary { cursor:pointer; color:var(--muted); font-size:13px; }
  .diff { margin-top:8px; font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; border-radius:8px; overflow:hidden; }
  .diff div { padding:2px 8px; white-space:pre-wrap; word-break:break-word; }
  .diff .a { background:var(--add-bg); color:var(--add); }
  .diff .r { background:var(--rm-bg); color:var(--rm); text-decoration:line-through; text-decoration-color:color-mix(in srgb, var(--rm) 40%, transparent); }
  .more { color:var(--muted); font-size:12px; padding:4px 8px; }
  .empty { text-align:center; color:var(--muted); padding:48px 16px; border:1px dashed var(--line); border-radius:14px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:36px 0 10px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:14px; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  tr:last-child td { border-bottom:0; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .tbl-wrap { overflow-x:auto; }
  td a { color:var(--accent); text-decoration:none; }
  @media (max-width:600px) { .meta { text-align:left; } }
  td.err { color:var(--rm); font-size:12px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Stake<span>out</span></h1>
      <p class="sub">What your competitors changed, every day.</p>
    </div>
    <div class="meta" id="meta">Loading…</div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <select id="fComp"><option value="">All competitors</option></select>
    <select id="fTag">
      <option value="">All types</option>
      <option>pricing</option><option>product</option><option>hiring</option><option>messaging</option><option>baseline</option>
    </select>
    <input id="fText" type="search" placeholder="Search changes…">
  </div>

  <div class="feed" id="feed"></div>

  <h2>Watch list</h2>
  <div class="tbl-wrap"><table id="targets"></table></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const fmtDay = iso => new Date(iso).toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric", year:"numeric" });
const ago = iso => {
  if (!iso) return "—";
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
};
let EVENTS = [];

async function load() {
  const bust = "?t=" + Date.now();
  const [changes, status] = await Promise.all([
    fetch("data/changes.json" + bust).then(r => r.ok ? r.json() : []).catch(() => []),
    fetch("data/status.json" + bust).then(r => r.ok ? r.json() : {}).catch(() => ({})),
  ]);
  EVENTS = changes;
  const targets = status.targets || [];
  $("meta").innerHTML = status.last_run ? `Last scan ${ago(status.last_run)}<br>${new Date(status.last_run).toLocaleString()}` : "No scans yet";

  const week = Date.now() - 7 * 864e5;
  const real = changes.filter(e => e.type === "change");
  const comps = [...new Set(targets.map(t => t.competitor))];
  $("stats").innerHTML = [
    [comps.length, "competitors"],
    [targets.length, "pages watched"],
    [real.filter(e => new Date(e.date) > week).length, "changes this week"],
    [real.filter(e => e.tags.includes("pricing") && new Date(e.date) > week).length, "pricing moves this week"],
  ].map(([n, l]) => `<div class="stat"><b>${n}</b><small>${l}</small></div>`).join("");

  $("fComp").innerHTML = '<option value="">All competitors</option>' + comps.map(c => `<option>${esc(c)}</option>`).join("");

  $("targets").innerHTML = "<tr><th>Competitor</th><th>Page</th><th>Last change</th><th>Status</th></tr>" +
    targets.map(t => `<tr>
      <td>${esc(t.competitor)}</td>
      <td><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.label)}</a></td>
      <td>${ago(t.last_changed)}</td>
      ${t.ok ? '<td><span class="dot" style="background:var(--add)"></span>OK</td>'
             : `<td class="err"><span class="dot" style="background:var(--rm)"></span>${esc(t.error)}</td>`}
    </tr>`).join("");
  render();
}

function render() {
  const c = $("fComp").value, tag = $("fTag").value, q = $("fText").value.toLowerCase();
  const list = EVENTS.filter(e =>
    (!c || e.competitor === c) && (!tag || e.tags.includes(tag)) &&
    (!q || [e.summary, ...(e.added || []), ...(e.removed || [])].join(" ").toLowerCase().includes(q)));
  if (!list.length) {
    $("feed").innerHTML = `<div class="empty">${EVENTS.length ? "Nothing matches these filters." : "No changes yet. The first scan saves a baseline; changes appear from the next one."}</div>`;
    return;
  }
  let html = "", lastDay = "";
  for (const e of list) {
    const day = fmtDay(e.date);
    if (day !== lastDay) { html += `<div class="day">${day}</div>`; lastDay = day; }
    const diff = [...(e.added || []).map(l => `<div class="a">+ ${esc(l)}</div>`), ...(e.removed || []).map(l => `<div class="r">− ${esc(l)}</div>`)].join("");
    const hidden = (e.added_total || 0) + (e.removed_total || 0) - (e.added || []).length - (e.removed || []).length;
    html += `<article class="ev">
      <div class="ev-top">
        <div class="who">${esc(e.competitor)} · ${esc(e.label)}<a href="${esc(e.url)}" target="_blank" rel="noopener">open ↗</a></div>
        <div class="tags">${e.tags.map(t => `<span class="tag" style="color:var(--${t}, var(--muted))">${esc(t)}</span>`).join("")}</div>
      </div>
      <p class="summary">${esc(e.summary)}</p>
      ${diff ? `<details><summary>See the diff</summary><div class="diff">${diff}${hidden > 0 ? `<div class="more">…and ${hidden} more line(s)</div>` : ""}</div></details>` : ""}
    </article>`;
  }
  $("feed").innerHTML = html;
}

["fComp", "fTag"].forEach(id => $(id).onchange = render);
$("fText").oninput = render;
load();
</script>
</body>
</html>
