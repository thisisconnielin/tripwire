name: Tripwire scan

# Nightly: fetch every page in watch/targets.yml, diff, write watch/reports/<date>.md.
# Friday-night run (Saturday UTC) also writes a 7-day digest.
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = previous day 9pm PST / 10pm PDT
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [watch/targets.yml]   # rescan right after you add a competitor

permissions:
  contents: write

concurrency:
  group: tripwire
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Scan
        id: scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: AI summaries
        run: python skills/tripwire/scripts/tripwire.py scan
      - name: Weekly digest
        if: github.event_name == 'schedule' && steps.scan.outcome == 'success'
        run: |
          if [ "$(date -u +%u)" = 6 ]; then
            python skills/tripwire/scripts/tripwire.py report --days 7 --out "week-$(date -u -d yesterday +%F).md"
          fi
      - name: Commit results
        env:
          AUTHOR: ${{ vars.COMMIT_AUTHOR || 'tripwire-bot <41898282+github-actions[bot]@users.noreply.github.com>' }}
        run: |
          git config user.name  "tripwire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit --author="$AUTHOR" -m "scan $(date -u +%F): ${{ steps.scan.outputs.changes }} change(s)" \
            -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          git push
