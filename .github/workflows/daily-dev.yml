name: Daily dev (Claude)

# When ENABLE_DAILY_DEV=true, Claude ships one small, tested improvement and pushes to main,
# three times a day. It develops the skill's code; it never scans competitors.
on:
  schedule:
    - cron: "30 16 * * *"  # 8:30am PST / 9:30am PDT
    - cron: "30 22 * * *"  # 2:30pm PST / 3:30pm PDT
    - cron: "30 4 * * *"   # 8:30pm PST / 9:30pm PDT (previous calendar day)
  workflow_dispatch:
    inputs:
      task:
        description: "Optional: tell Claude what to do (otherwise it follows CLAUDE.md)"
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: tripwire
  cancel-in-progress: false

jobs:
  dev:
    if: vars.ENABLE_DAILY_DEV == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            You are the maintainer of Tripwire. This is a DAILY run: follow the "Daily run" rules in CLAUDE.md exactly.
            Today's date (UTC): run `date -u +%F`.
            Commit author: ${{ vars.COMMIT_AUTHOR || 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' }}
            Special request (may be empty): ${{ github.event.inputs.task }}
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(git:*),Bash(date:*),Bash(ls:*),Bash(cat:*),Bash(curl:*)"
