# Stakeout watch list.
# Add a competitor, list the pages you care about, push. That's it.
#
#   - name: Acme
#     pages:
#       - { label: home,      url: https://acme.com }
#       - { label: pricing,   url: https://acme.com/pricing }
#       - { label: changelog, url: https://acme.com/changelog }
#       - { label: careers,   url: https://acme.com/careers }
#
# Optional, at any level (global / competitor / page):
#   ignore:    [regex, ...]   lines matching these are stripped before diffing
#   min_lines: 2              ignore changes smaller than this many lines

min_lines: 1
ignore: []

competitors:
  - name: Teamily
    pages:
      - { label: home, url: https://teamily.ai }
